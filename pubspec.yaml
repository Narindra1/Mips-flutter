##### Source code of app Mahafaka
# Project build on: Flutter 3.29.3,  Dart 3.7.2 ,  DevTools 2.42.3
# Architecture: Clean
# State manager: BloC
# Routing: go_router
# To build use: flutter build apk --obfuscate --split-debug-info=debug-info --no-tree-shake-icons
#
name: MIPS
# name: Mahafaka
description: "An utlimate ad and utility app"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.2.10
# version: 0.1.6

