name: mips
description: "An utlimate ad and utility app"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.4

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  app_links: ^7.2.1
  bot_toast: ^4.1.3
  device_info_plus: ^13.2.0
  device_preview: ^1.3.1
  easy_localization: ^3.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  json_theme: ^11.0.0
  flutter_localizations:
    sdk: flutter
  equatable: ^2.1.0
  dio: ^5.11.0
  internet_connection_checker: ^3.0.1
  dart_pusher_channels: ^1.3.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  encrypt_shared_preferences: ^1.0.1
  package_info_plus: ^10.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  photo_view: ^0.15.0
  loading_animation_widget: ^1.3.0
  syncfusion_flutter_pdfviewer: ^34.2.3
  webview_flutter: ^4.14.1
  iconify_flutter: ^0.0.7
  colorful_iconify_flutter: ^0.0.5
  super_banners: ^0.0.1
  in_app_update: ^5.0.0
  breakpoint: ^1.3.2
  country_flags: ^4.1.2
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  dotted_border: ^3.1.0
  reorderables: ^0.6.0
  animations: ^2.2.0
  share_plus: ^13.3.0
  flag: ^7.0.2
  pattern_formatter: ^4.0.1
  visibility_detector: ^0.4.0+2
  flutter_native_splash: ^2.4.8
  meta: ^1.18.0
  image: ^4.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/imgs/ic_mahafaka.png"
  min_sdk_android: 16 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/imgs/ic_mahafaka.png"
  windows:
    generate: true
    image_path: "assets/imgs/ic_mahafaka.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/imgs/ic_mahafaka.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/imgs/
    - assets/imgs/avatars/
    - assets/imgs/conseil_imgs/
    - assets/imgs/maha_nouvelle_imgs/
    - assets/theme/
  fonts:
    - family: Raleway
      fonts:
        - asset: assets/fonts/raleway/Raleway-Thin.ttf
          weight: 100
        - asset: assets/fonts/raleway/Raleway-ThinItalic.ttf
          weight: 100
          style: italic

        - asset: assets/fonts/raleway/Raleway-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/raleway/Raleway-ExtraLightItalic.ttf
          weight: 200
          style: italic

        - asset: assets/fonts/raleway/Raleway-Light.ttf
          weight: 300
        - asset: assets/fonts/raleway/Raleway-LightItalic.ttf
          weight: 300
          style: italic

        - asset: assets/fonts/raleway/Raleway-Regular.ttf
          weight: 400
        - asset: assets/fonts/raleway/Raleway-Italic.ttf
          weight: 400
          style: italic

        - asset: assets/fonts/raleway/Raleway-Medium.ttf
          weight: 500
        - asset: assets/fonts/raleway/Raleway-MediumItalic.ttf
          weight: 500
          style: italic

        - asset: assets/fonts/raleway/Raleway-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/raleway/Raleway-SemiBoldItalic.ttf
          weight: 600
          style: italic

        - asset: assets/fonts/raleway/Raleway-Bold.ttf
          weight: 700
        - asset: assets/fonts/raleway/Raleway-BoldItalic.ttf
          weight: 700
          style: italic

        - asset: assets/fonts/raleway/Raleway-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/raleway/Raleway-ExtraBoldItalic.ttf
          weight: 800
          style: italic

        - asset: assets/fonts/raleway/Raleway-Black.ttf
          weight: 900
        - asset: assets/fonts/raleway/Raleway-BlackItalic.ttf
          weight: 900
          style: italic

    - family: Pretendard
      fonts:
        - asset: assets/fonts/pretendard/Pretendard-Thin.otf
          weight: 100

        - asset: assets/fonts/pretendard/Pretendard-ExtraLight.otf
          weight: 200

        - asset: assets/fonts/pretendard/Pretendard-Light.otf
          weight: 300

        - asset: assets/fonts/pretendard/Pretendard-Regular.otf
          weight: 400

        - asset: assets/fonts/pretendard/Pretendard-Medium.otf
          weight: 500

        - asset: assets/fonts/pretendard/Pretendard-SemiBold.otf
          weight: 600

        - asset: assets/fonts/pretendard/Pretendard-Bold.otf
          weight: 700

        - asset: assets/fonts/pretendard/Pretendard-ExtraBold.otf
          weight: 800

        - asset: assets/fonts/pretendard/Pretendard-Black.otf
          weight: 900
