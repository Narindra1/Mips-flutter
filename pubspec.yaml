  bot_toast: ^4.1.3
  google_fonts: ^6.2.1
  json_theme: ^8.0.0+3
  flutter_native_splash: ^2.4.0
  url_launcher: ^6.3.2
  animations: ^2.0.11
  country_flags: ^4.1.0
  package_info_plus: ^9.0.0
  breakpoint: ^1.2.0
  path_provider: ^2.1.5
  # shared_preferences: ^2.5.3
  iconify_flutter: ^0.0.7
  super_banners: ^0.0.1
  flutter_reorderable_grid_view: ^5.5.0
  reorderables: ^0.6.0
  flutter_svg: ^2.1.0
  webview_flutter: ^4.13.0
  terminate_restart: ^1.0.11
  syncfusion_flutter_pdfviewer: ^31.1.19
  ota_update: ^7.0.2
  wakelock_plus: ^1.3.2
  dart_pusher_channels:
    path: ./lib_mod/dart_pusher_channels
  overlay_support: ^2.1.0
  # font_awesome_flutter: ^10.9.1
  # material_symbols_icons: ^4.2874.0
  ionicons: ^0.2.2
  flag: ^7.0.2
  equatable: ^2.0.7
  pattern_formatter: ^4.0.1
  device_preview: ^1.2.0
  easy_localization: ^3.0.8
  app_links: ^6.4.1
  share_plus: ^12.0.1

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.27
  image_picker_android: 0.8.12+23
  url_launcher_android: 6.3.16
dev_dependencies:
  mockito: ^5.4.4
  build_runner: ^2.4.8
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: "^0.14.1"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/imgs/ic_mahafaka.png"
  min_sdk_android: 16 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/imgs/ic_mahafaka.png"
  windows:
    generate: true
    image_path: "assets/imgs/ic_mahafaka.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/imgs/ic_mahafaka.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/imgs/
    - assets/imgs/avatars/
    - assets/imgs/conseil_imgs/
    - assets/imgs/maha_nouvelle_imgs/
    - assets/theme/
    # - assets/fonts/
    # - google_fonts/
  fonts:
    - family: Raleway
      fonts:
        - asset: assets/fonts/raleway/Raleway-Thin.ttf
          weight: 100
        - asset: assets/fonts/raleway/Raleway-ThinItalic.ttf
          weight: 100
          style: italic

        - asset: assets/fonts/raleway/Raleway-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/raleway/Raleway-ExtraLightItalic.ttf
          weight: 200
          style: italic

        - asset: assets/fonts/raleway/Raleway-Light.ttf
          weight: 300
        - asset: assets/fonts/raleway/Raleway-LightItalic.ttf
          weight: 300
          style: italic

        - asset: assets/fonts/raleway/Raleway-Regular.ttf
          weight: 400
        - asset: assets/fonts/raleway/Raleway-Italic.ttf
          weight: 400
          style: italic

        - asset: assets/fonts/raleway/Raleway-Medium.ttf
          weight: 500
        - asset: assets/fonts/raleway/Raleway-MediumItalic.ttf
          weight: 500
          style: italic

        - asset: assets/fonts/raleway/Raleway-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/raleway/Raleway-SemiBoldItalic.ttf
          weight: 600
          style: italic

        - asset: assets/fonts/raleway/Raleway-Bold.ttf
          weight: 700
        - asset: assets/fonts/raleway/Raleway-BoldItalic.ttf
          weight: 700
          style: italic

        - asset: assets/fonts/raleway/Raleway-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/raleway/Raleway-ExtraBoldItalic.ttf
          weight: 800
          style: italic

        - asset: assets/fonts/raleway/Raleway-Black.ttf
          weight: 900
        - asset: assets/fonts/raleway/Raleway-BlackItalic.ttf
          weight: 900
          style: italic

